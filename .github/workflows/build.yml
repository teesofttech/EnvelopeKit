name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build EnvelopeKit.sln --configuration Release

  jwe-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install JavaScript dependencies
        run: npm ci
        working-directory: prototypes/jwe-interop/browser
      - name: Run cross-runtime JWE interoperability spike
        run: npm run interop
        working-directory: prototypes/jwe-interop/browser
